<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Project Dashboard</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row vh-100">
        
        <!-- MAIN CONTENT -->
        <div class="col-md-8 p-4">
            <h3 class="mb-3">Dashboard</h3>

            <div class="card shadow">
                <div class="card-body">
                    <div id="content" class="table-responsive">
                        <p class="text-muted">Select an action to view data</p>
                    </div>

                    <!-- Pagination -->
                    <nav>
                        <ul class="pagination justify-content-center mt-3" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="col-md-2 bg-white border-start p-4">
            <h5 class="mb-4">Actions</h5>
            <div class="d-grid gap-2">
                <button class="btn btn-primary" onclick="loadContent('raw')">Raw Table</button>
                <button class="btn btn-success" onclick="loadContent('u1')">Usecase 1</button>
                <button class="btn btn-warning" onclick="loadContent('u2')">Usecase 2</button>
                <button class="btn btn-danger" onclick="loadContent('u3')">Usecase 3</button>
                <button class="btn btn-dark" onclick="loadContent('u4')">Usecase 4</button>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
